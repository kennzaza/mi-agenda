# Actualiza las ofertas de Steam que muestra la pestaña "Aplicaciones".
# Steam no deja llamar desde el navegador, así que este workflow baja
# las ofertas cada 6 horas y guarda el resultado en el repositorio.
name: Actualizar ofertas de Steam

on:
  schedule:
    - cron: "20 */6 * * *"   # cada 6 horas, a los 20 minutos (fuera de hora pico)
  workflow_dispatch:          # también se puede disparar a mano desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código del repositorio
        uses: actions/checkout@v4

      - name: Pedir las ofertas a Steam (región Argentina, en español)
        run: |
          curl -sS --fail --retry 3 --retry-delay 5 \
            "https://store.steampowered.com/api/featuredcategories/?json=1&cc=ar&l=spanish" \
            -o /tmp/steam-featured.json

      - name: Armar el archivo de ofertas
        run: node .github/scripts/steam-offers.js /tmp/steam-featured.json

      - name: Guardar si algo cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ofertas-steam.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las ofertas."
          else
            git commit -m "chore: actualizar ofertas de Steam"
            git push
          fi
