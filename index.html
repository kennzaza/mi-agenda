<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Agenda</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141414">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#141414;
    --panel:#1c1c1c;
    --panel2:#232323;
    --border:#2e2e2e;
    --text:#e4e4e4;
    --muted:#8a8a8a;
    --accent:#5a5a5a;
    --danger:#8a4b4b;
    --warn:#8a7a4b;
    --ok:#4b6a5a;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    overflow:hidden;
  }
  h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.5px;color:#ccc;}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 8px 0;}

  #app{display:flex;flex-direction:column;height:100%;}

  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:14px 16px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  #topbar .brand{display:flex;flex-direction:column;}
  #topbar .brand span{font-size:10px;color:var(--muted);}
  #topClock{font-size:15px;color:#ddd;letter-spacing:.5px;}
  #topWeather{
    display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
    background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:5px 10px;
  }
  #topWeather .temp{color:#ddd;font-size:13px;}

  #rainAlertBar{
    display:none;
    background:#2e2620;border-bottom:1px solid #4a3f2e;color:#d8c79a;
    font-size:12px;padding:8px 16px;flex-shrink:0;
  }

  #views{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(90px + var(--safe-bottom)) 14px;}
  .view{display:none;}
  .view.active{display:block;}

  #bottomNav{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;
    background:var(--panel);
    border-top:1px solid var(--border);
    padding-bottom:var(--safe-bottom);
    z-index:50;
  }
  .navBtn{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:10px 0 8px 0;
    background:none;border:none;color:var(--muted);font-size:10px;
  }
  .navBtn .icon{font-size:20px;line-height:1;}
  .navBtn.active{color:#ddd;}

  #fab{
    position:fixed;
    right:18px;
    bottom:calc(78px + var(--safe-bottom));
    width:56px;height:56px;
    border-radius:50%;
    background:#2a2a2a;
    border:1px solid var(--border);
    color:#ddd;
    font-size:26px;
    display:flex;align-items:center;justify-content:center;
    z-index:60;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  #fab:active{background:#333;}

  form{display:flex;flex-direction:column;gap:10px;}
  label{font-size:11px;color:var(--muted);}
  input,select{
    background:#181818;
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 10px;
    border-radius:8px;
    font-size:15px;
    width:100%;
  }
  input:focus,select:focus{outline:1px solid var(--accent);}
  button{
    background:#2a2a2a;
    color:var(--text);
    border:1px solid var(--border);
    padding:12px;
    border-radius:8px;
    font-size:14px;
    min-height:44px;
  }
  button:active{background:#333;}

  #calHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  #calHeader button{padding:8px 16px;min-height:40px;}
  #calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .dow{text-align:center;font-size:10px;color:var(--muted);padding:4px 0;}
  .day{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:6px;
    min-height:46px;
    padding:4px;
    font-size:11px;
    color:#bbb;
    position:relative;
    cursor:pointer;
  }
  .day.empty{background:transparent;border:none;}
  .day.today{border-color:#777;border-width:1.5px;}
  .daynum{font-size:11px;color:var(--muted);}
  .dot{width:5px;height:5px;border-radius:50%;display:inline-block;margin:2px 2px 0 0;}
  .dot.reminder{background:var(--accent);}
  .dot.subscription{background:var(--warn);}
  .dot.debt{background:var(--danger);}
  .dot.trial{background:var(--ok);}
  .dot.memory{background:#6a8a9a;}

  #calLegend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;font-size:11px;color:var(--muted);}
  #calLegend div{display:flex;align-items:center;gap:5px;}

  .overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.65);
    align-items:flex-end;
    justify-content:center;
    z-index:200;
  }
  .overlay.open{display:flex;}
  .modalBox{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px 14px 0 0;
    padding:20px;
    width:100%;
    max-width:480px;
    max-height:85vh;
    overflow-y:auto;
  }
  .modalBox h3{margin:0 0 4px 0;font-size:15px;color:#ddd;}
  .modalBox .sub{font-size:11px;color:var(--muted);margin-bottom:12px;}
  .modalBox textarea{
    width:100%;
    min-height:110px;
    background:#181818;
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:10px;
    font-size:15px;
    font-family:inherit;
    resize:vertical;
  }
  .modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .modalActions button{padding:10px 14px;}
  #modalDelete{margin-right:auto;background:transparent;border:1px solid var(--border);color:#a77;}

  #list{display:flex;flex-direction:column;gap:8px;}
  .item{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .item.past{opacity:.45;}
  .item .info{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .item .title{font-size:14px;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item .meta{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tag{font-size:9px;padding:3px 7px;border-radius:20px;border:1px solid var(--border);color:#ccc;white-space:nowrap;flex-shrink:0;}
  .tag.reminder{background:#2a2a2a;}
  .tag.subscription{background:#33301f;}
  .tag.debt{background:#332222;}
  .tag.trial{background:#1f2e26;}
  .del{background:transparent;border:none;color:var(--muted);font-size:16px;min-height:auto;padding:4px 6px;flex-shrink:0;}
  .empty-msg{color:var(--muted);font-size:13px;padding:16px 0;text-align:center;}

  .debtCard{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
  .debtCard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .debtCard .title{font-size:14px;color:#ddd;}
  .debtCard .nums{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6;}
  .debtCard .barBg{background:#181818;border-radius:6px;height:6px;margin-top:8px;overflow:hidden;}
  .debtCard .barFill{background:#5a7a6a;height:100%;}
  .debtCard .payBtn{padding:8px 12px;font-size:12px;min-height:auto;flex-shrink:0;}
  .payHistory{margin-top:8px;font-size:11px;color:#888;display:flex;flex-direction:column;gap:2px;}
  .paidOff{opacity:.5;}

  #debtsTotal{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
  #debtsTotalAmount{font-size:26px;color:#ddd;margin-top:2px;}
</style>
</head>
<body>

<div id="app">

  <div id="topbar">
    <div class="brand">
      <h1>Agenda</h1>
      <span id="topClock">--:--:--</span>
    </div>
    <div id="topWeather">Cargando clima...</div>
  </div>

  <div id="rainAlertBar"></div>

  <div id="views">

    <div class="view active" id="view-calendar">
      <div id="calHeader">
        <button id="prevMonth">‹</button>
        <div id="monthLabel" style="font-size:14px;color:#ccc;"></div>
        <button id="nextMonth">›</button>
      </div>
      <div id="calGrid"></div>
      <div id="calLegend">
        <div><span class="dot reminder"></span>Recordatorio</div>
        <div><span class="dot subscription"></span>Suscripción</div>
        <div><span class="dot debt"></span>Deuda</div>
        <div><span class="dot trial"></span>Prueba</div>
        <div><span class="dot memory"></span>Recuerdo</div>
      </div>
    </div>

    <div class="view" id="view-list">
      <h2>Próximos</h2>
      <div id="listItems"></div>
    </div>

    <div class="view" id="view-debts">
      <h2>Deudas</h2>
      <div id="debtsTotal">
        <div style="font-size:11px;color:var(--muted);">Deuda total pendiente</div>
        <div id="debtsTotalAmount">$0</div>
      </div>
      <div id="debtsList"></div>
    </div>

  </div>

  <button id="fab" type="button">+</button>

  <div id="bottomNav">
    <button class="navBtn active" data-view="view-calendar"><span class="icon">📅</span>Calendario</button>
    <button class="navBtn" data-view="view-list"><span class="icon">📋</span>Agenda</button>
    <button class="navBtn" data-view="view-debts"><span class="icon">💰</span>Deudas</button>
  </div>

</div>

<div id="formModalOverlay" class="overlay">
  <div class="modalBox">
    <h3>Nuevo</h3>
    <form id="form">
      <label>Título</label>
      <input id="title" type="text" placeholder="Ej: Netflix, cuota tarjeta, turno médico" required>

      <label>Tipo</label>
      <select id="type">
        <option value="reminder">Recordatorio</option>
        <option value="subscription">Suscripción</option>
        <option value="debt">Deuda</option>
        <option value="trial">Período de prueba</option>
      </select>

      <label id="dateLabel">Fecha</label>
      <input id="date" type="date" required>

      <div id="amountField" style="display:none;">
        <label>Monto total de la deuda</label>
        <input id="amount" type="number" min="0" step="0.01" placeholder="Ej: 50000">
      </div>

      <label>Notas (opcional)</label>
      <input id="notes" type="text" placeholder="Monto, detalle, etc.">

      <div class="modalActions">
        <button type="button" id="formCancel">Cancelar</button>
        <button type="submit">Agregar</button>
      </div>
    </form>
  </div>
</div>

<div id="modalOverlay" class="overlay">
  <div class="modalBox">
    <h3 id="modalTitle">Recuerdo del día</h3>
    <div class="sub" id="modalSub"></div>
    <textarea id="modalTextarea" placeholder="Escribí algo que pasó este día..."></textarea>
    <div class="modalActions">
      <button id="modalDelete" type="button">Borrar</button>
      <button id="modalCancel" type="button">Cancelar</button>
      <button id="modalSave" type="button">Guardar</button>
    </div>
  </div>
</div>

<div id="payModalOverlay" class="overlay">
  <div class="modalBox">
    <h3>Registrar pago</h3>
    <div id="payModalSub" class="sub"></div>
    <label>Monto pagado</label>
    <input id="payAmount" type="number" min="0" step="0.01" placeholder="Ej: 5000">
    <div class="modalActions">
      <button id="payCancel" type="button">Cancelar</button>
      <button id="payConfirm" type="button">Guardar pago</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "agenda_items_v1";
let items = [];
try { items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { items = []; }

let viewDate = new Date();
viewDate.setDate(1);

const typeLabels = {
  reminder: "Recordatorio",
  subscription: "Suscripción",
  debt: "Deuda",
  trial: "Período de prueba"
};

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }

function fmtDate(d){
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("es-AR", {day:"2-digit", month:"short", year:"numeric"});
}
function fmtMoney(n){
  return "$" + n.toLocaleString("es-AR", {minimumFractionDigits:0, maximumFractionDigits:2});
}

document.querySelectorAll(".navBtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".navBtn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.view).classList.add("active");
  });
});

const formModalOverlay = document.getElementById("formModalOverlay");
document.getElementById("fab").addEventListener("click", ()=>{
  formModalOverlay.classList.add("open");
});
document.getElementById("formCancel").addEventListener("click", ()=>{
  formModalOverlay.classList.remove("open");
});
formModalOverlay.addEventListener("click", (e)=>{
  if(e.target === formModalOverlay) formModalOverlay.classList.remove("open");
});

document.getElementById("type").addEventListener("change", (e)=>{
  document.getElementById("dateLabel").textContent =
    e.target.value === "trial" ? "Fecha límite para cancelar" : "Fecha";
  document.getElementById("amountField").style.display =
    e.target.value === "debt" ? "block" : "none";
});

document.getElementById("form").addEventListener("submit", (e)=>{
  e.preventDefault();
  const title = document.getElementById("title").value.trim();
  const type = document.getElementById("type").value;
  const date = document.getElementById("date").value;
  const notes = document.getElementById("notes").value.trim();
  const amount = document.getElementById("amount").value;
  if(!title || !date) return;

  const newItem = { id: Date.now().toString(), title, type, date, notes };
  if(type === "debt"){
    newItem.amount = amount ? parseFloat(amount) : 0;
    newItem.payments = [];
  }
  items.push(newItem);
  save();
  document.getElementById("form").reset();
  document.getElementById("dateLabel").textContent = "Fecha";
  document.getElementById("amountField").style.display = "none";
  formModalOverlay.classList.remove("open");
  render();
});

function removeItem(id){
  items = items.filter(i => i.id !== id);
  save();
  render();
}

function renderCalendar(){
  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  const dows = ["L","M","X","J","V","S","D"];
  dows.forEach(d=>{
    const el = document.createElement("div");
    el.className = "dow";
    el.textContent = d;
    grid.appendChild(el);
  });

  const label = viewDate.toLocaleDateString("es-AR", {month:"long", year:"numeric"});
  document.getElementById("monthLabel").textContent = label.charAt(0).toUpperCase()+label.slice(1);

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const firstDay = new Date(year, month, 1);
  let startOffset = firstDay.getDay() - 1;
  if(startOffset < 0) startOffset = 6;

  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  for(let i=0;i<startOffset;i++){
    const el = document.createElement("div");
    el.className = "day empty";
    grid.appendChild(el);
  }

  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const el = document.createElement("div");
    el.className = "day" + (dateStr === todayStr ? " today" : "");
    const dayItems = items.filter(i => i.date === dateStr);
    const hasMemory = !!dayNotes[dateStr];
    el.innerHTML = `<div class="daynum">${day}</div>` +
      dayItems.map(i => `<span class="dot ${i.type}"></span>`).join("") +
      (hasMemory ? `<span class="dot memory"></span>` : "");
    el.addEventListener("click", ()=> openDayModal(dateStr));
    grid.appendChild(el);
  }
}

function renderList(){
  const container = document.getElementById("listItems");
  container.innerHTML = "";
  if(items.length === 0){
    container.innerHTML = `<div class="empty-msg">No hay nada agendado todavía.</div>`;
    return;
  }
  const sorted = [...items].sort((a,b)=> a.date.localeCompare(b.date));
  const todayStr = new Date().toISOString().slice(0,10);

  sorted.forEach(i=>{
    const div = document.createElement("div");
    div.className = "item" + (i.date < todayStr ? " past" : "");
    let metaExtra = i.notes ? " · " + i.notes : "";
    if(i.type === "debt" && i.amount){
      const paid = (i.payments || []).reduce((s,p)=> s + p.amount, 0);
      const remaining = Math.max(i.amount - paid, 0);
      metaExtra += ` · Restante ${fmtMoney(remaining)}`;
    }
    div.innerHTML = `
      <div class="info">
        <div class="title">${i.title}</div>
        <div class="meta">${fmtDate(i.date)}${metaExtra}</div>
      </div>
      <span class="tag ${i.type}">${typeLabels[i.type]}</span>
      <button class="del" data-id="${i.id}">✕</button>
    `;
    container.appendChild(div);
  });

  container.querySelectorAll(".del").forEach(btn=>{
    btn.addEventListener("click", ()=> removeItem(btn.dataset.id));
  });
}

function render(){
  renderCalendar();
  renderList();
  renderDebts();
}

function renderDebts(){
  const debts = items.filter(i => i.type === "debt");
  const container = document.getElementById("debtsList");
  container.innerHTML = "";

  let totalPending = 0;

  if(debts.length === 0){
    container.innerHTML = `<div class="empty-msg">No cargaste deudas todavía.</div>`;
  }

  debts.forEach(d=>{
    const paid = (d.payments || []).reduce((s,p)=> s + p.amount, 0);
    const total = d.amount || 0;
    const remaining = Math.max(total - paid, 0);
    totalPending += remaining;
    const pct = total > 0 ? Math.min((paid/total)*100, 100) : 0;

    const card = document.createElement("div");
    card.className = "debtCard" + (remaining <= 0 && total > 0 ? " paidOff" : "");
    card.innerHTML = `
      <div class="top">
        <div class="title">${d.title}${remaining<=0 && total>0 ? " ✓ saldada" : ""}</div>
        <button class="payBtn" data-id="${d.id}" type="button">+ Pago</button>
      </div>
      <div class="nums">Total ${fmtMoney(total)}<br>Pagado ${fmtMoney(paid)} · Restante ${fmtMoney(remaining)}</div>
      <div class="barBg"><div class="barFill" style="width:${pct}%;"></div></div>
      ${(d.payments && d.payments.length) ? `<div class="payHistory">` +
        d.payments.map(p => `<div>· ${fmtMoney(p.amount)} el ${fmtDate(p.date)}</div>`).join("") +
        `</div>` : ""}
    `;
    container.appendChild(card);
  });

  document.getElementById("debtsTotalAmount").textContent = fmtMoney(totalPending);

  container.querySelectorAll(".payBtn").forEach(btn=>{
    btn.addEventListener("click", ()=> openPayModal(btn.dataset.id));
  });
}

let currentPayDebtId = null;
const payModalOverlay = document.getElementById("payModalOverlay");

function openPayModal(debtId){
  currentPayDebtId = debtId;
  const debt = items.find(i => i.id === debtId);
  document.getElementById("payModalSub").textContent = debt ? debt.title : "";
  document.getElementById("payAmount").value = "";
  payModalOverlay.classList.add("open");
}
function closePayModal(){
  payModalOverlay.classList.remove("open");
  currentPayDebtId = null;
}
document.getElementById("payCancel").addEventListener("click", closePayModal);
document.getElementById("payConfirm").addEventListener("click", ()=>{
  const amountVal = parseFloat(document.getElementById("payAmount").value);
  if(!amountVal || amountVal <= 0) return;
  const debt = items.find(i => i.id === currentPayDebtId);
  if(!debt) return;
  if(!debt.payments) debt.payments = [];
  debt.payments.push({ amount: amountVal, date: new Date().toISOString().slice(0,10) });
  save();
  closePayModal();
  renderDebts();
});
payModalOverlay.addEventListener("click", (e)=>{
  if(e.target === payModalOverlay) closePayModal();
});

const NOTES_KEY = "agenda_daynotes_v1";
let dayNotes = {};
try { dayNotes = JSON.parse(localStorage.getItem(NOTES_KEY)) || {}; } catch(e) { dayNotes = {}; }

let currentModalDate = null;
const modalOverlay = document.getElementById("modalOverlay");
const modalTextarea = document.getElementById("modalTextarea");
const modalSub = document.getElementById("modalSub");

function openDayModal(dateStr){
  currentModalDate = dateStr;
  modalTextarea.value = dayNotes[dateStr] || "";
  modalSub.textContent = fmtDate(dateStr);
  modalOverlay.classList.add("open");
}
function closeDayModal(){
  modalOverlay.classList.remove("open");
  currentModalDate = null;
}
document.getElementById("modalCancel").addEventListener("click", closeDayModal);
document.getElementById("modalSave").addEventListener("click", ()=>{
  const text = modalTextarea.value.trim();
  if(text){ dayNotes[currentModalDate] = text; } else { delete dayNotes[currentModalDate]; }
  localStorage.setItem(NOTES_KEY, JSON.stringify(dayNotes));
  closeDayModal();
  renderCalendar();
});
document.getElementById("modalDelete").addEventListener("click", ()=>{
  delete dayNotes[currentModalDate];
  localStorage.setItem(NOTES_KEY, JSON.stringify(dayNotes));
  closeDayModal();
  renderCalendar();
});
modalOverlay.addEventListener("click", (e)=>{
  if(e.target === modalOverlay) closeDayModal();
});

document.getElementById("prevMonth").addEventListener("click", ()=>{
  viewDate.setMonth(viewDate.getMonth()-1);
  renderCalendar();
});
document.getElementById("nextMonth").addEventListener("click", ()=>{
  viewDate.setMonth(viewDate.getMonth()+1);
  renderCalendar();
});

render();

const WEATHER_LAT = -34.7636;
const WEATHER_LON = -58.2119;

const weatherCodes = {
  0:"Despejado", 1:"Mayorm. despejado", 2:"Parc. nublado", 3:"Nublado",
  45:"Niebla", 48:"Niebla helada",
  51:"Llovizna débil", 53:"Llovizna", 55:"Llovizna intensa",
  61:"Lluvia débil", 63:"Lluvia", 65:"Lluvia intensa",
  66:"Lluvia helada", 67:"Lluvia helada intensa",
  71:"Nevada débil", 73:"Nevada", 75:"Nevada intensa",
  80:"Chubascos débiles", 81:"Chubascos", 82:"Chubascos intensos",
  95:"Tormenta", 96:"Tormenta con granizo", 99:"Tormenta con granizo fuerte"
};

async function loadWeather(){
  const box = document.getElementById("topWeather");
  const alertBar = document.getElementById("rainAlertBar");
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&current=temperature_2m,weather_code&hourly=precipitation_probability&timezone=America%2FArgentina%2FBuenos_Aires`;
    const res = await fetch(url);
    const data = await res.json();
    const c = data.current;
    const desc = weatherCodes[c.weather_code] || "—";
    box.innerHTML = `<span class="temp">${Math.round(c.temperature_2m)}°C</span> · ${desc}`;

    const times = data.hourly.time;
    const probs = data.hourly.precipitation_probability;
    const nowIdx = times.findIndex(t => new Date(t) >= new Date());
    let maxProb = 0, maxHour = null;
    for(let i = nowIdx; i < nowIdx + 12 && i < times.length; i++){
      if(probs[i] > maxProb){ maxProb = probs[i]; maxHour = times[i]; }
    }
    if(maxProb >= 40){
      const hourStr = new Date(maxHour).toLocaleTimeString("es-AR", {hour:"2-digit", minute:"2-digit"});
      alertBar.style.display = "block";
      alertBar.textContent = `⚠ Probabilidad de lluvia ${maxProb}% cerca de las ${hourStr}. Llevá paraguas.`;
    } else {
      alertBar.style.display = "none";
    }
  }catch(e){
    box.textContent = "Sin conexión";
    alertBar.style.display = "none";
  }
}
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);

function updateClock(){
  document.getElementById("topClock").textContent = new Date().toLocaleTimeString("es-AR", {hour12:false});
}
updateClock();
setInterval(updateClock, 1000);

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").then(async (reg)=>{
      try{
        if("periodicSync" in reg){
          const status = await navigator.permissions.query({name:"periodic-background-sync"});
          if(status.state === "granted"){
            await reg.periodicSync.register("check-agenda", { minInterval: 6 * 60 * 60 * 1000 });
          }
        }
      }catch(e){}
    }).catch(()=>{});
  });
  navigator.serviceWorker.addEventListener("message", (event)=>{
    if(event.data && event.data.type === "CHECK_DUE") checkDueAndNotify();
  });
}

function showNotif(title, body){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  if(navigator.serviceWorker && navigator.serviceWorker.controller){
    navigator.serviceWorker.ready.then(reg=>{
      reg.showNotification(title, { body, icon: "icon-192.png", badge: "icon-192.png" });
    });
  } else {
    new Notification(title, { body, icon: "icon-192.png" });
  }
}

const NOTIF_LOG_KEY = "agenda_notif_log_v1";
function alreadyNotifiedToday(key){
  const log = JSON.parse(localStorage.getItem(NOTIF_LOG_KEY) || "{}");
  return log[key] === new Date().toISOString().slice(0,10);
}
function markNotified(key){
  const log = JSON.parse(localStorage.getItem(NOTIF_LOG_KEY) || "{}");
  log[key] = new Date().toISOString().slice(0,10);
  localStorage.setItem(NOTIF_LOG_KEY, JSON.stringify(log));
}

function checkDueAndNotify(){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  const todayStr = new Date().toISOString().slice(0,10);
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowStr = tomorrow.toISOString().slice(0,10);

  items.forEach(i=>{
    if(i.date === todayStr && !alreadyNotifiedToday("today-"+i.id)){
      showNotif("Hoy: " + i.title, typeLabels[i.type] + (i.notes ? " · " + i.notes : ""));
      markNotified("today-"+i.id);
    } else if(i.date === tomorrowStr && !alreadyNotifiedToday("tomorrow-"+i.id)){
      showNotif("Mañana: " + i.title, typeLabels[i.type]);
      markNotified("tomorrow-"+i.id);
    }
  });
}

if("Notification" in window && Notification.permission === "default"){
  Notification.requestPermission();
}
checkDueAndNotify();
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible") checkDueAndNotify();
});
setInterval(checkDueAndNotify, 30 * 60 * 1000);
</script>
